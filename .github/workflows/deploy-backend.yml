name: Deploy backend

on:
  # Manual-only for now. The push trigger is commented out because the OIDC
  # provider and GitHubActionsDeployRole do not exist in the account yet, so
  # every push would fail at the role-assumption step. Do the one-time IAM
  # setup in README §6, then uncomment the push block below.
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'backend/**'
  #     - '.github/workflows/deploy-backend.yml'

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::136311627418:role/GitHubActionsDeployRole
          aws-region: us-east-1

      - name: Install dependencies
        working-directory: backend
        # @aws-app-monetization/sdk comes from a private registry; backend/.npmrc
        # reads the token from this env var. Add the secret in the repo settings.
        env:
          MONETIZATION_REGISTRY_TOKEN: ${{ secrets.MONETIZATION_REGISTRY_TOKEN }}
        run: npm ci

      - name: CDK deploy
        working-directory: backend
        run: npx cdk deploy --require-approval never
